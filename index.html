<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kovai Nitro: Street Syndicate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #05070c;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    max-width: 480px;
    height: 100vh;
    max-height: 900px;
    background: #0d1117;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
    border: 1px solid #1f293d;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Top HUD */
  .hud-top {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .hud-card {
    background: rgba(10, 15, 29, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 6px 12px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .hud-val {
    font-size: 16px;
    color: #00f0ff;
    font-weight: 900;
  }
  .bar-container {
    width: 70px;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 3px;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.15s ease-out;
  }
  .fuel-fill { background: linear-gradient(90deg, #ff0055, #ffaa00); }
  .hp-fill { background: linear-gradient(90deg, #00f0ff, #00ff88); }

  /* Mobile Touch Controls */
  .controls-layer {
    position: absolute;
    bottom: 16px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 20;
  }
  .control-group {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  .btn-touch {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.85);
    border: 2px solid rgba(0, 240, 255, 0.5);
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    touch-action: manipulation;
  }
  .btn-touch:active {
    background: #00f0ff;
    color: #000;
    transform: scale(0.92);
  }
  .btn-touch span {
    font-size: 8px;
    text-transform: uppercase;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .btn-nitro {
    background: rgba(255, 0, 85, 0.3);
    border-color: #ff0055;
    box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
  }
  .btn-nitro:active {
    background: #ff0055;
    color: #fff;
  }

  /* Screens & Overlays */
  .overlay-screen {
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 12, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 30;
    backdrop-filter: blur(8px);
  }
  .title-glitch {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #00f0ff;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    margin-bottom: 4px;
  }
  .sub-tag {
    font-size: 13px;
    color: #ffaa00;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .btn-action {
    background: linear-gradient(135deg, #00f0ff, #0077ff);
    color: #000;
    border: none;
    font-size: 16px;
    font-weight: 900;
    padding: 14px 36px;
    border-radius: 30px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    transition: transform 0.1s;
  }
  .btn-action:active {
    transform: scale(0.95);
  }
  .guide-box {
    margin-top: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.6;
    max-width: 320px;
  }
  .guide-box b { color: #fff; }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <div class="hud-top">
    <div class="hud-card">
      <div>Fuel</div>
      <div class="bar-container"><div id="fuelBar" class="bar-fill fuel-fill"></div></div>
    </div>
    <div class="hud-card" style="text-align: center;">
      <div id="distVal" class="hud-val">0 KM</div>
      <div id="speedVal" style="font-size:10px; color:#ffaa00;">0 KM/H</div>
    </div>
    <div class="hud-card">
      <div>Armor</div>
      <div class="bar-container"><div id="hpBar" class="bar-fill hp-fill"></div></div>
    </div>
  </div>

  <div class="controls-layer">
    <div class="control-group">
      <button class="btn-touch" id="btnLeft">◀<span>Left</span></button>
      <button class="btn-touch" id="btnRight">▶<span>Right</span></button>
    </div>
    <div class="control-group">
      <button class="btn-touch btn-nitro" id="btnNitro">⚡<span>Nitro</span></button>
    </div>
  </div>

  <div id="startScreen" class="overlay-screen">
    <div class="title-glitch">KOVAI NITRO</div>
    <div class="sub-tag">Avinashi Road Drift & Survival</div>
    <button class="btn-action" id="startBtn">START ENGINE</button>
    <div class="guide-box">
      <b>Controls:</b> Left / Right arrow keys or touch buttons to steer. Tap <b>Nitro</b> for hyper-speed.<br><br>
      Pick up <b>Jerry Cans</b> to survive the fuel drain and dodge heavy Kovai traffic!
    </div>
  </div>

  <div id="gameOverScreen" class="overlay-screen" style="display: none;">
    <div class="title-glitch" style="color: #ff0055;">BUSTED / CRASHED</div>
    <div class="sub-tag" id="reasonText">Fuel Empty!</div>
    <div style="font-size: 20px; margin-bottom: 20px;">Distance: <b id="finalDist" style="color:#00f0ff;">0 KM</b></div>
    <button class="btn-action" id="restartBtn">RESTART RACE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

function resize() {
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// Web Audio API Sound System
let audioCtx = null;
function playSound(type) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;

  if (type === 'rev') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, t);
    osc.frequency.exponentialRampToValueAtTime(180, t + 0.3);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.3);
  } else if (type === 'fuel') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.setValueAtTime(880, t + 0.1);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
    osc.start(t);
    osc.stop(t + 0.25);
  } else if (type === 'crash') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.linearRampToValueAtTime(30, t + 0.4);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
    osc.start(t);
    osc.stop(t + 0.4);
  }
}

// Game State
let isPlaying = false;
let distance = 0;
let speed = 0;
let maxSpeed = 160;
let fuel = 100;
let armor = 100;
let nitroActive = false;

// Player Car
const player = {
  x: canvas.width / 2,
  y: canvas.height - 180,
  w: 52,
  h: 96,
  targetX: canvas.width / 2,
  speedX: 0
};

// Road Lanes & Obstacles
const laneWidth = 72;
let roadOffset = 0;
let traffic = [];
let pickups = [];

function spawnTraffic() {
  const lanes = [-1.5, -0.5, 0.5, 1.5];
  const chosenLane = lanes[Math.floor(Math.random() * lanes.length)];
  const centerX = canvas.width / 2;
  const types = [
    { type: 'bus', w: 58, h: 140, color: '#16a34a', speedMult: 0.65 },
    { type: 'auto', w: 42, h: 56, color: '#eab308', speedMult: 0.8 },
    { type: 'sedan', w: 48, h: 88, color: '#e2e8f0', speedMult: 1.0 }
  ];
  const model = types[Math.floor(Math.random() * types.length)];
  traffic.push({
    x: centerX + chosenLane * laneWidth - model.w / 2,
    y: -200,
    w: model.w,
    h: model.h,
    color: model.color,
    type: model.type,
    speed: (speed * 0.4 + 2) * model.speedMult
  });
}

function spawnPickup() {
  const lanes = [-1.5, -0.5, 0.5, 1.5];
  const chosenLane = lanes[Math.floor(Math.random() * lanes.length)];
  const centerX = canvas.width / 2;
  pickups.push({
    x: centerX + chosenLane * laneWidth - 14,
    y: -80,
    w: 28,
    h: 34,
    type: Math.random() > 0.4 ? 'fuel' : 'repair'
  });
}

// Draw Player Sports Car
function drawCar(x, y, w, h) {
  ctx.save();
  ctx.translate(x, y);

  // Underglow neon
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = nitroActive ? 30 : 15;
  ctx.fillStyle = nitroActive ? '#00f0ff' : 'rgba(0, 240, 255, 0.3)';
  ctx.fillRect(-w/2 - 4, -h/2 - 4, w + 8, h + 8);
  ctx.shadowBlur = 0;

  // Car Body Base
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.roundRect(-w/2, -h/2, w, h, 8);
  ctx.fill();

  // Cyan Racing Livery Panels
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(-w/2 + 6, -h/2 + 10, w - 12, h - 20);

  // Windshield & Roof
  ctx.fillStyle = '#090d16';
  ctx.beginPath();
  ctx.roundRect(-w/2 + 8, -h/2 + 24, w - 16, 26, 4);
  ctx.fill();

  // Rear Glass
  ctx.fillStyle = '#090d16';
  ctx.fillRect(-w/2 + 10, h/2 - 28, w - 20, 14);

  // GT Wing Spoiler
  ctx.fillStyle = '#000';
  ctx.fillRect(-w/2 - 2, h/2 - 8, w + 4, 8);

  // Taillights
  ctx.fillStyle = '#ff0055';
  ctx.shadowColor = '#ff0055';
  ctx.shadowBlur = 12;
  ctx.fillRect(-w/2 + 4, h/2 - 2, 10, 4);
  ctx.fillRect(w/2 - 14, h/2 - 2, 10, 4);
  ctx.shadowBlur = 0;

  // Nitro Flames
  if (nitroActive) {
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(-w/2 + 6, h/2 + 4, 6, 18 + Math.random() * 12);
    ctx.fillRect(w/2 - 12, h/2 + 4, 6, 18 + Math.random() * 12);
  }

  ctx.restore();
}

// Draw Traffic Vehicle
function drawVehicle(v) {
  ctx.save();
  ctx.translate(v.x + v.w/2, v.y + v.h/2);

  ctx.fillStyle = v.color;
  ctx.beginPath();
  ctx.roundRect(-v.w/2, -v.h/2, v.w, v.h, 6);
  ctx.fill();

  // Windshields
  ctx.fillStyle = '#020617';
  if (v.type === 'bus') {
    ctx.fillRect(-v.w/2 + 4, -v.h/2 + 8, v.w - 8, 20);
    ctx.fillStyle = '#fff';
    ctx.font = '8px sans-serif';
    ctx.fillText('TNSTC', -14, -v.h/2 + 20);
  } else {
    ctx.fillRect(-v.w/2 + 6, -v.h/2 + 12, v.w - 12, 18);
  }

  // Red Taillights
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(-v.w/2 + 3, v.h/2 - 4, 8, 4);
  ctx.fillRect(v.w/2 - 11, v.h/2 - 4, 8, 4);

  ctx.restore();
}

// Input Handlers
let keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

const btnL = document.getElementById('btnLeft');
const btnR = document.getElementById('btnRight');
const btnN = document.getElementById('btnNitro');

btnL.addEventListener('pointerdown', () => { keys['ArrowLeft'] = true; });
btnL.addEventListener('pointerup', () => { keys['ArrowLeft'] = false; });
btnR.addEventListener('pointerdown', () => { keys['ArrowRight'] = true; });
btnR.addEventListener('pointerup', () => { keys['ArrowRight'] = false; });
btnN.addEventListener('pointerdown', () => { keys['Nitro'] = true; });
btnN.addEventListener('pointerup', () => { keys['Nitro'] = false; });

// Loop
let lastTime = performance.now();
let spawnTimer = 0;
let pickupTimer = 0;

function gameLoop(time) {
  if (!isPlaying) return;
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  // Steering & Speed
  nitroActive = keys['Nitro'] || keys[' '] || keys['Shift'];
  const accel = nitroActive ? 40 : 25;
  const topSpd = nitroActive ? 220 : 160;

  if (speed < topSpd) speed += accel * dt;
  if (speed > topSpd) speed -= 30 * dt;

  const moveSpeed = (speed / 160) * 360 * dt;
  if (keys['ArrowLeft'] || keys['a']) player.x -= moveSpeed;
  if (keys['ArrowRight'] || keys['d']) player.x += moveSpeed;

  // Clamp Road Bounds
  const roadLeft = canvas.width / 2 - laneWidth * 2;
  const roadRight = canvas.width / 2 + laneWidth * 2;
  if (player.x - player.w / 2 < roadLeft) player.x = roadLeft + player.w / 2;
  if (player.x + player.w / 2 > roadRight) player.x = roadRight - player.w / 2;

  // Fuel drain
  fuel -= (nitroActive ? 6.5 : 3.5) * dt;
  distance += (speed * dt) / 3600;

  // Update HUD
  document.getElementById('fuelBar').style.width = Math.max(0, fuel) + '%';
  document.getElementById('hpBar').style.width = Math.max(0, armor) + '%';
  document.getElementById('distVal').innerText = distance.toFixed(1) + ' KM';
  document.getElementById('speedVal').innerText = Math.round(speed) + ' KM/H';

  if (fuel <= 0) return endGame('Out of Fuel!');
  if (armor <= 0) return endGame('Vehicle Totaled!');

  // Road Animation
  roadOffset = (roadOffset + speed * 0.12) % 40;

  // Render Ground
  ctx.fillStyle = '#080c14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Render Asphalt Road
  ctx.fillStyle = '#111827';
  ctx.fillRect(roadLeft, 0, laneWidth * 4, canvas.height);

  // Side Neon Curbs
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(roadLeft - 4, 0, 4, canvas.height);
  ctx.fillRect(roadRight, 0, 4, canvas.height);

  // Dashed Lane Markers
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let l = 1; l <= 3; l++) {
    const lx = roadLeft + l * laneWidth;
    for (let y = -40 + roadOffset; y < canvas.height; y += 40) {
      ctx.fillRect(lx - 2, y, 4, 20);
    }
  }

  // Spawners
  spawnTimer += dt;
  if (spawnTimer > 1.2) {
    spawnTraffic();
    spawnTimer = 0;
  }
  pickupTimer += dt;
  if (pickupTimer > 3.0) {
    spawnPickup();
    pickupTimer = 0;
  }

  // Update & Draw Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.y += speed * 0.12;

    ctx.fillStyle = p.type === 'fuel' ? '#ffaa00' : '#00ff88';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Hit test with player
    if (Math.abs(player.x - (p.x + p.w/2)) < (player.w + p.w)/2 &&
        Math.abs(player.y - (p.y + p.h/2)) < (player.h + p.h)/2) {
      playSound('fuel');
      if (p.type === 'fuel') fuel = Math.min(100, fuel + 25);
      if (p.type === 'repair') armor = Math.min(100, armor + 20);
      pickups.splice(i, 1);
      continue;
    }
    if (p.y > canvas.height + 50) pickups.splice(i, 1);
  }

  // Update & Draw Traffic
  for (let i = traffic.length - 1; i >= 0; i--) {
    const v = traffic[i];
    v.y += (speed * 0.12) - v.speed;
    drawVehicle(v);

    // Collision check
    if (Math.abs(player.x - (v.x + v.w/2)) < (player.w/2 + v.w/2 - 6) &&
        Math.abs(player.y - (v.y + v.h/2)) < (player.h/2 + v.h/2 - 6)) {
      playSound('crash');
      if (navigator.vibrate) navigator.vibrate(100);
      armor -= 30;
      speed = 60;
      traffic.splice(i, 1);
      continue;
    }
    if (v.y > canvas.height + 200) traffic.splice(i, 1);
  }

  // Draw Player Car
  player.y = canvas.height - 180;
  drawCar(player.x, player.y, player.w, player.h);

  requestAnimationFrame(gameLoop);
}

function startGame() {
  playSound('rev');
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  traffic = [];
  pickups = [];
  fuel = 100;
  armor = 100;
  distance = 0;
  speed = 40;
  player.x = canvas.width / 2;
  isPlaying = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function endGame(reason) {
  isPlaying = false;
  document.getElementById('reasonText').innerText = reason;
  document.getElementById('finalDist').innerText = distance.toFixed(1) + ' KM';
  document.getElementById('gameOverScreen').style.display = 'flex';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
